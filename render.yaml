services:
  - type: web
    name: smart-bus-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
        description: MongoDB Atlas connection string — MUST include /smart_bus_tracking database at end of URI (standard mongodb:// form with explicit shards recommended, /smart_bus_tracking NOT /smartbustracking)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false
        description: "Comma-separated list of allowed frontend URLs — fill this AFTER you deploy Vercel apps, e.g.: https://smart-bus-tracking-nine.vercel.app, https://smart-bus-driver.vercel.app"
    healthCheckPath: /
    numInstances: 1
    autoDeploy: commit
